name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit to deploy (defaults to the triggering commit)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Generate manifest and package version indexes
        run: sh generate-manifest.sh

      - name: Validate generated catalog
        run: |
          jq empty manifest.json
          meta_count="$(find packages -name '.meta' | wc -l | tr -d ' ')"
          package_count="$(jq '.packages | length' manifest.json)"
          versions_count="$(find packages -name 'versions.json' | wc -l | tr -d ' ')"
          test "$meta_count" = "$package_count"
          test "$meta_count" = "$versions_count"
          find packages -name 'versions.json' -exec jq empty {} +

      - name: Sign manifest.json
        env:
          ZENPM_PRIVATE_KEY: ${{ secrets.ZENPM_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ZENPM_PRIVATE_KEY" > zenpm-key
          openssl pkeyutl -sign -inkey zenpm-key -in manifest.json -rawin -out manifest.json.sig
          rm zenpm-key

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
